<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคำนวณขวดเร่งเวลา Clone (ระบบจับคู่คุ้มสุด)</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
      font-size: 1.3rem;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    .setting-box {
      background: #162032;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .plan-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .plan-best {
      border-color: #22c55e;
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.08) 0%, #0f172a 100%);
    }
    .plan-fast {
      border-color: #38bdf8;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.08) 0%, #0f172a 100%);
    }
    .plan-title {
      font-size: 0.95rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: normal;
    }
    .badge-green { background: #22c55e; color: #052e16; font-weight: bold; }
    .badge-blue { background: #38bdf8; color: #082f49; font-weight: bold; }
    .plan-detail {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .plan-highlight {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f1f5f9;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧪 แนะนำการใช้ขวดเร่งเวลาที่ดีที่สุด</h2>

    <div class="form-group">
      <label>เวลาที่ต้องใช้โคลนทั้งหมด</label>
      <div class="row">
        <label style="font-size:0.75rem; align-self:center;">ชั่วโมง</label>
        <input type="number" id="hours" placeholder="ชั่วโมง" value="0" min="0" oninput="calculate()">
        <label style="font-size:0.75rem; align-self:center;">ชั่วโมง</label>
        <input type="number" id="minutes" placeholder="นาที" value="0" min="0" max="59" oninput="calculate()">
      </div>
    </div>

    <!-- ตั้งค่าคุณสมบัติขวด -->
    <div class="setting-box">
      <div class="row">
        <div style="flex: 1;">
          <label>🔷 ขวดใหญ่ (5 นาที)</label>
          <select id="multiplierA" onchange="calculate()">
            <option value="10">10 เท่า (ลด 50 นาที)</option>
            <option value="15" selected>15 เท่า (ลด 75 นาที)</option>
            <option value="20">20 เท่า (ลด 100 นาที)</option>
            <option value="30">30 เท่า (ลด 150 นาที)</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>🔶 ขวดเล็ก (5 นาที)</label>
          <select id="multiplierB" onchange="calculate()">
            <option value="2">2 เท่า (ลด 10 นาที)</option>
            <option value="5">5 เท่า (ลด 25 นาที)</option>
            <option value="8">8 เท่า (ลด 40 นาที)</option>
            <option value="10" selected>10 เท่า (ลด 50 นาที)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- แผนที่ 1: ผสมคุ้มสุด -->
    <div class="plan-card plan-best">
      <div class="plan-title" style="color: #4ade80;">
        <span>🎯 แผนคุ้มค่าที่สุด (ไม่เหลือเศษทิ้ง)</span>
        <span class="badge badge-green">แนะนำ</span>
      </div>
      <div class="plan-highlight" id="optMix">-</div>
      <div class="plan-detail" id="optMixDetail">-</div>
    </div>

    <!-- แผนที่ 2: กดพร้อมกันเร็วสุด -->
    <div class="plan-card plan-fast">
      <div class="plan-title" style="color: #38bdf8;">
        <span>⚡ แผนกดคู่กันพร้อมกัน (เสร็จไวสุดในชีวิตจริง)</span>
        <span class="badge badge-blue">ประหยัดเวลารอ</span>
      </div>
      <div class="plan-highlight" id="optCombo">-</div>
      <div class="plan-detail" id="optComboDetail">-</div>
    </div>

    <!-- แผนที่ 3: ใช้ขวดเดี่ยว -->
    <div class="plan-card">
      <div class="plan-title" style="color: #94a3b8;">
        <span>📦 กรณีมีแค่ขวดเดียว</span>
      </div>
      <div class="plan-detail" id="optSingle">-</div>
    </div>
  </div>

  <script>
    const DURATION = 5;

    function formatHM(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.round(totalMinutes % 60);
      if (h > 0 && m > 0) return `${h} ชม. ${m} นาที`;
      if (h > 0) return `${h} ชม.`;
      return `${m} นาที`;
    }

    function calculate() {
      const hours = parseFloat(document.getElementById('hours').value) || 0;
      const minutes = parseFloat(document.getElementById('minutes').value) || 0;
      
      const multA = parseFloat(document.getElementById('multiplierA').value) || 15;
      const multB = parseFloat(document.getElementById('multiplierB').value) || 10;

      const targetMinutes = (hours * 60) + minutes;
      const speedA = multA * DURATION; // ขวดใหญ่ 15x = 75 นาที
      const speedB = multB * DURATION; // ขวดเล็ก 10x = 50 นาที

      if (targetMinutes <= 0) {
        document.getElementById('optMix').innerText = 'กรุณากรอกเวลา';
        document.getElementById('optMixDetail').innerText = '-';
        document.getElementById('optCombo').innerText = '-';
        document.getElementById('optComboDetail').innerText = '-';
        document.getElementById('optSingle').innerText = '-';
        return;
      }

      // --- 1. แผนคุ้มค่าที่สุด (หาชุดผสมที่เวลาเกินน้อยที่สุด) ---
      let bestA = 0;
      let bestB = 0;
      let minExcess = Infinity;
      const maxA = Math.ceil(targetMinutes / speedA);

      for (let a = 0; a <= maxA; a++) {
        const remaining = targetMinutes - (a * speedA);
        const b = remaining > 0 ? Math.ceil(remaining / speedB) : 0;
        const total = (a * speedA) + (b * speedB);
        const excess = total - targetMinutes;

        if (excess < minExcess || (excess === minExcess && (a + b) < (bestA + bestB))) {
          minExcess = excess;
          bestA = a;
          bestB = b;
        }
      }

      const mixTotalTime = (bestA * speedA) + (bestB * speedB);
      const mixWaitReal = (bestA + bestB) * DURATION;

      let mixStr = '';
      if (bestA > 0 && bestB > 0) {
        mixStr = `ขวดใหญ่ ${bestA} ขวด + ขวดเล็ก ${bestB} ขวด`;
      } else if (bestA > 0) {
        mixStr = `ขวดใหญ่ ${bestA} ขวด (ไม่ต้องใช้ขวดเล็ก)`;
      } else {
        mixStr = `ขวดเล็ก ${bestB} ขวด (ไม่ต้องใช้ขวดใหญ่)`;
      }

      document.getElementById('optMix').innerText = mixStr;
      document.getElementById('optMixDetail').innerHTML = `
        • รวมเวลาเกมที่เร่งได้: <b>${formatHM(mixTotalTime)}</b> (เกินทิ้งเพียง ${minExcess} นาที)<br>
        • เวลารอจริงในชีวิต: <b>${mixWaitReal} นาที</b> (เมื่อกดทีละขวด)
      `;

      // --- 2. แผนกดคู่กันพร้อมกัน (Combo 1 ใหญ่ + 1 เล็ก ใน 5 นาที = ลด 125 นาที) ---
      const comboSpeed = speedA + speedB;
      const comboSets = Math.ceil(targetMinutes / comboSpeed);
      const comboWaitReal = comboSets * DURATION;
      const comboExcess = (comboSets * comboSpeed) - targetMinutes;

      document.getElementById('optCombo').innerText = `กดพร้อมกัน ${comboSets} รอบ (ใหญ่ ${comboSets} + เล็ก ${comboSets} ขวด)`;
      document.getElementById('optComboDetail').innerHTML = `
        • เวลาจริงในชีวิตที่ใช้: <b style="color:#38bdf8;">เพียง ${comboWaitReal} นาที</b> (กดรวดเดียว)<br>
        • รวมเวลาเกมที่ลดได้: <b>${formatHM(comboSets * comboSpeed)}</b> (เกิน ${comboExcess} นาที)
      `;

      // --- 3. แผนขวดเดี่ยว ---
      const onlyA = Math.ceil(targetMinutes / speedA);
      const onlyB = Math.ceil(targetMinutes / speedB);
      document.getElementById('optSingle').innerHTML = `
        • <b>ขวดใหญ่ล้วน (15x):</b> ${onlyA} ขวด (เกิน ${(onlyA * speedA) - targetMinutes} นาที | รอจริง ${onlyA * DURATION} นาที)<br>
        • <b>ขวดเล็กล้วน (10x):</b> ${onlyB} ขวด (เกิน ${(onlyB * speedB) - targetMinutes} นาที | รอจริง ${onlyB * DURATION} นาที)
      `;
    }

    calculate();
  </script>
</body>
</html>
