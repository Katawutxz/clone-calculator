<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคำนวณขวดเร่งเวลา Clone (ระบบคำนวณแม่นยำ)</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
      font-size: 1.3rem;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    .setting-box {
      background: #162032;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .plan-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .plan-best {
      border-color: #22c55e;
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.08) 0%, #0f172a 100%);
    }
    .plan-fast {
      border-color: #38bdf8;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.08) 0%, #0f172a 100%);
    }
    .plan-title {
      font-size: 0.95rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-green { background: #22c55e; color: #052e16; font-weight: bold; }
    .badge-blue { background: #38bdf8; color: #082f49; font-weight: bold; }
    .plan-detail {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .plan-highlight {
      font-size: 1.05rem;
      font-weight: bold;
      color: #f1f5f9;
      margin: 4px 0;
    }
    .text-waste {
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧪 แนะนำการใช้ขวดเร่งเวลา Clone</h2>

    <div class="form-group">
      <label>เวลาที่ต้องใช้โคลนทั้งหมด</label>
      <div class="row">
        <input type="number" id="hours" placeholder="ชั่วโมง" value="0" min="0" oninput="calculate()">
        <label style="align-self: center; color: #94a3b8;">ชั่วโมง</label>
        <input type="number" id="minutes" placeholder="นาที" value="0" min="0" max="59" oninput="calculate()">
        <label style="align-self: center; color: #94a3b8;">นาที</label>
      </div>
    </div>

    <!-- ตั้งค่าคุณสมบัติขวด -->
    <div class="setting-box">
      <div class="row">
        <div style="flex: 1;">
          <label>🔷 ขวดใหญ่ (5 นาที)</label>
          <select id="multiplierA" onchange="calculate()">
            <!-- <option value="10">10 เท่า (ลด 50 นาที/ขวด)</option> -->
            <option value="15" selected>15 เท่า (ลด 75 นาที/ขวด)</option>
            <!-- <option value="20">20 เท่า (ลด 100 นาที/ขวด)</option>
            <option value="30">30 เท่า (ลด 150 นาที/ขวด)</option> -->
          </select>
        </div>
        <div style="flex: 1;">
          <label>🔶 ขวดเล็ก (5 นาที)</label>
          <select id="multiplierB" onchange="calculate()">
            <!-- <option value="2">2 เท่า (ลด 10 นาที/ขวด)</option>
            <option value="5">5 เท่า (ลด 25 นาที/ขวด)</option>
            <option value="8">8 เท่า (ลด 40 นาที/ขวด)</option> -->
            <option value="10" selected>10 เท่า (ลด 50 นาที/ขวด)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- แผนที่ 1: ผสมคุ้มสุด -->
    <div class="plan-card plan-best">
      <div class="plan-title" style="color: #4ade80;">
        <span>🎯 แผนคุ้มค่าที่สุด (ประหยัดขวด ไม่ล้นทิ้ง)</span>
        <span class="badge badge-green">แนะนำ</span>
      </div>
      <div class="plan-highlight" id="optMix">-</div>
      <div class="plan-detail" id="optMixDetail">-</div>
    </div>

    <!-- แผนที่ 2: กดพร้อมกันเร็วสุด -->
    <div class="plan-card plan-fast">
      <div class="plan-title" style="color: #38bdf8;">
        <span>⚡ แผนกดคู่กันพร้อมกัน (เสร็จไวสุดในชีวิตจริง)</span>
        <span class="badge badge-blue">เร็วที่สุด</span>
      </div>
      <div class="plan-highlight" id="optCombo">-</div>
      <div class="plan-detail" id="optComboDetail">-</div>
    </div>

    <!-- แผนที่ 3: ใช้ขวดเดี่ยว -->
    <div class="plan-card">
      <div class="plan-title" style="color: #94a3b8;">
        <span>📦 กรณีมีแค่ขวดเดียว</span>
      </div>
      <div class="plan-detail" id="optSingle">-</div>
    </div>
  </div>

  <script>
    const DURATION = 5; // แต่ละขวดมีระยะเวลาทำงาน 5 นาที

    function formatHM(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.round(totalMinutes % 60);
      if (h > 0 && m > 0) return `${h} ชม. ${m} นาที`;
      if (h > 0) return `${h} ชม.`;
      return `${m} นาที`;
    }

    function formatTimeSec(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      if (m > 0 && s > 0) return `${m} นาที ${s} วินาที`;
      if (m > 0) return `${m} นาที`;
      return `${s} วินาที`;
    }

    function calculate() {
      const hours = parseFloat(document.getElementById('hours').value) || 0;
      const minutes = parseFloat(document.getElementById('minutes').value) || 0;
      
      const multA = parseFloat(document.getElementById('multiplierA').value) || 15;
      const multB = parseFloat(document.getElementById('multiplierB').value) || 10;

      const targetMinutes = (hours * 60) + minutes;
      const speedA = multA * DURATION; // ลดเวลาหลอดเกมได้กี่นาที
      const speedB = multB * DURATION; // ลดเวลาหลอดเกมได้กี่นาที

      if (targetMinutes <= 0) {
        document.getElementById('optMix').innerText = 'กรุณากรอกเวลา';
        document.getElementById('optMixDetail').innerText = '-';
        document.getElementById('optCombo').innerText = '-';
        document.getElementById('optComboDetail').innerText = '-';
        document.getElementById('optSingle').innerText = '-';
        return;
      }

      // --- 1. แผนคุ้มค่าที่สุด ---
      let bestA = 0;
      let bestB = 0;
      let minExcess = Infinity;
      const maxA = Math.ceil(targetMinutes / speedA);

      for (let a = 0; a <= maxA; a++) {
        const remaining = targetMinutes - (a * speedA);
        const b = remaining > 0 ? Math.ceil(remaining / speedB) : 0;
        const total = (a * speedA) + (b * speedB);
        const excess = total - targetMinutes;

        if (excess < minExcess || (excess === minExcess && (a + b) < (bestA + bestB))) {
          minExcess = excess;
          bestA = a;
          bestB = b;
        }
      }

      const mixTotalTime = (bestA * speedA) + (bestB * speedB);
      let mixStr = '';
      if (bestA > 0 && bestB > 0) {
        mixStr = `ขวดใหญ่ ${bestA} ขวด + ขวดเล็ก ${bestB} ขวด`;
      } else if (bestA > 0) {
        mixStr = `ขวดใหญ่ ${bestA} ขวด`;
      } else {
        mixStr = `ขวดเล็ก ${bestB} ขวด`;
      }

      document.getElementById('optMix').innerText = mixStr;
      document.getElementById('optMixDetail').innerHTML = `
        • เร่งหลอดเกมได้รวม: <b>${formatHM(mixTotalTime)}</b> (หลอดเกมล้นทิ้งเพียง ${minExcess} นาที)<br>
        • เวลารอจริงถ้ากดต่อกัน: <b>${(bestA + bestB) * DURATION} นาที</b>
      `;

      // --- 2. แผนกดคู่กันพร้อมกัน ---
      const comboSpeedPerSet = speedA + speedB; // 1 รอบ (5 นาที) หลอดเกมลดได้ 125 นาที
      const comboSets = Math.ceil(targetMinutes / comboSpeedPerSet);
      const exactRealSecNeeded = (targetMinutes / (multA + multB)) * 60; // วินาทีจริงที่โคลนเสร็จ
      const totalAllocatedSec = comboSets * DURATION * 60; // วินาทีทั้งหมดของจำนวนขวดที่กด
      const wasteRealSec = totalAllocatedSec - exactRealSecNeeded;
      const gameExcessMinutes = (comboSets * comboSpeedPerSet) - targetMinutes;

      document.getElementById('optCombo').innerText = `กดพร้อมกัน ${comboSets} คู่ (ใหญ่ ${comboSets} + เล็ก ${comboSets} ขวด)`;
      document.getElementById('optComboDetail').innerHTML = `
        • <b>เวลาจริงที่ต้องรอ:</b> <span style="color:#38bdf8; font-weight:bold;">${formatTimeSec(exactRealSecNeeded)}</span> (เสร็จสมบูรณ์)<br>
        • <b>หลอดเกมที่เร่งได้:</b> ${formatHM(comboSets * comboSpeedPerSet)} <span class="text-waste">(ล้นทิ้ง ${gameExcessMinutes} นาทีในเกม)</span><br>
        • <small style="color:#94a3b8;">*ในคู่สุดท้าย จะเสร็จก่อนเวลาบัฟหมด ${formatTimeSec(wasteRealSec)}</small>
      `;

      // --- 3. แผนขวดเดี่ยว ---
      const onlyA = Math.ceil(targetMinutes / speedA);
      const onlyB = Math.ceil(targetMinutes / speedB);
      document.getElementById('optSingle').innerHTML = `
        • <b>ขวดใหญ่ล้วน (15x):</b> ${onlyA} ขวด (รอจริง ${onlyA * DURATION} นาที | ล้นเกม ${(onlyA * speedA) - targetMinutes} นาที)<br>
        • <b>ขวดเล็กล้วน (10x):</b> ${onlyB} ขวด (รอจริง ${onlyB * DURATION} นาที | ล้นเกม ${(onlyB * speedB) - targetMinutes} นาที)
      `;
    }

    calculate();
  </script>
</body>
</html>
