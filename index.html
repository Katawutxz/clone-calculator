<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคำนวณขวดเร่งเวลา Clone</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
      font-size: 1.4rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }
    .locked-input {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .result-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 24px;
      border: 1px solid #334155;
    }
    .highlight-row {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px dashed #334155;
      margin-bottom: 12px;
    }
    .highlight-val {
      font-size: 2.2rem;
      font-weight: bold;
      color: #4ade80;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    .detail-item:last-child {
      margin-bottom: 0;
    }
    .val {
      font-weight: 600;
      color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧪 คำนวณไอเทมเร่งเวลา</h2>

    <div class="form-group">
      <label>เวลาที่ต้องใช้โคลน</label>
      <div class="row">
        <input type="number" id="hours" placeholder="ชั่วโมง" value="29" min="0" oninput="calculate()">
        <label style="font-size:0.75rem; align-self:center;">ชั่วโมง</label>
        <input type="number" id="minutes" placeholder="นาที" value="0" min="0" max="59" oninput="calculate()">
        <label style="font-size:0.75rem; align-self:center;">นาที</label>
      </div>
    </div>

    <div class="form-group">
      <label>คุณสมบัติขวดเร่งเวลา</label>
      <div class="row">
        <div>
          <label style="font-size:0.75rem;">เร่งความเร็ว</label>
          <select id="multiplier" onchange="calculate()">
            <!-- <option value="2">2 เท่า</option>
            <option value="3">3 เท่า</option>
            <option value="5">5 เท่า</option> -->
            <option value="10">ขวดเล็ก</option>
            <option value="15" selected>ขวดใหญ่</option>
            <!-- <option value="20">20 เท่า</option>
            <option value="25">25 เท่า</option>
            <option value="30">30 เท่า</option> -->
          </select>
        </div>
        <div>
          <label style="font-size:0.75rem;">ระยะเวลาไอเทม</label>
          <input type="text" class="locked-input" value="5 นาที (ล็อก)" disabled readonly>
        </div>
      </div>
    </div>

    <div class="result-box">
      <div class="highlight-row">
        <div style="font-size: 0.85rem; color: #94a3b8;">ต้องใช้ทั้งหมด</div>
        <div class="highlight-val" id="bottlesCeil">0 ขวด</div>
      </div>
      <div class="detail-item">
        <span>จำนวนคำนวณเป๊ะๆ:</span>
        <span class="val" id="bottlesExact">0 ขวด</span>
      </div>
      <div class="detail-item">
        <span>ประสิทธิภาพต่อ 1 ขวด:</span>
        <span class="val" id="perBottle">0 นาที</span>
      </div>
      <div class="detail-item">
        <span>เวลารอจริงในชีวิต (หากกดรวดเดียว):</span>
        <span class="val" id="realTimeWait">0 นาที</span>
      </div>
    </div>
  </div>

  <script>
    const DURATION = 5; // ล็อกไว้ 5 นาทีเสมอ

    function calculate() {
      const hours = parseFloat(document.getElementById('hours').value) || 0;
      const minutes = parseFloat(document.getElementById('minutes').value) || 0;
      const multiplier = parseFloat(document.getElementById('multiplier').value) || 1;

      const totalTargetMinutes = (hours * 60) + minutes;
      const speedupPerBottle = multiplier * DURATION;

      if (speedupPerBottle <= 0 || totalTargetMinutes <= 0) {
        document.getElementById('bottlesCeil').innerText = '0 ขวด';
        document.getElementById('bottlesExact').innerText = '0 ขวด';
        document.getElementById('perBottle').innerText = '0 นาที';
        document.getElementById('realTimeWait').innerText = '0 นาที';
        return;
      }

      const exactBottles = totalTargetMinutes / speedupPerBottle;
      const ceilBottles = Math.ceil(exactBottles);
      const totalRealMinutes = exactBottles * DURATION;

      document.getElementById('bottlesCeil').innerText = `${ceilBottles} ขวด`;
      document.getElementById('bottlesExact').innerText = `${exactBottles.toFixed(2)} ขวด`;
      document.getElementById('perBottle').innerText = `${speedupPerBottle} นาที (${(speedupPerBottle/60).toFixed(2)} ชม.)`;
      
      const realHours = Math.floor(totalRealMinutes / 60);
      const realMins = Math.round(totalRealMinutes % 60);
      let realTimeStr = '';
      if (realHours > 0) realTimeStr += `${realHours} ชม. `;
      realTimeStr += `${realMins} นาที`;
      
      document.getElementById('realTimeWait').innerText = realTimeStr;
    }

    calculate();
  </script>
</body>
</html>
